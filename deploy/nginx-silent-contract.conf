# nginx site for Silent Contract. Installed by deploy/oracle-setup.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/silent-contract;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Deploys replace files in place, so the page and scripts are always revalidated.
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
